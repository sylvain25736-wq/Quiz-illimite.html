<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Académie du Fromager — Quiz Illimité | Chez Sylvain</title>
<meta name="theme-color" content="#d97706">

<style>
:root {
  --primary: #d97706;
  --bg: #fef3c7;
  --dark: #2d2013;
  --white: #fff;
  --error: #dc2626;
  --success: #059669;
  --card-border: #fcd34d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--dark);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 500px;
  background: var(--white);
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 10px 25px #2d20131a;
  border: 3px solid var(--primary);
  text-align: center;
  margin-bottom: 18px;
}
h1 {
  font-size: clamp(1.8rem, 7vw, 2.3rem);
  color: var(--primary);
  margin: 0 0 8px;
}
.subtitle {
  font-size: .95rem;
  margin: 0 0 16px;
  font-style: italic;
  color: #6b523b;
}
.badge {
  display: inline-block;
  background: var(--bg);
  color: var(--primary);
  border: 1.5px solid var(--primary);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: bold;
  margin-bottom: 18px;
}
.progress-bar {
  height: 8px;
  background: #fee2e2;
  border-radius: 5px;
  margin-bottom: 22px;
  overflow: hidden;
}
.progress {
  height: 100%;
  background: var(--primary);
  width: 0;
  transition: width .3s;
}
.card { display: none; }
.card.active { display: block; }
.question {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.45;
  margin: 0 0 18px;
}
.btn-option {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #fffbeb;
  border: 2px solid var(--card-border);
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--dark);
  cursor: pointer;
  text-align: left;
}
.btn-option:hover,
.btn-option:focus {
  background: var(--primary);
  color: #fff;
}
.btn-option:disabled { opacity: .65; }
.btn-action {
  background: var(--primary);
  color: #fff;
  border: 0;
  padding: 14px 20px;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  text-decoration: none;
  display: inline-block;
}
.btn-secondary {
  background: #059669;
}
.feedback {
  font-weight: 700;
  margin-top: 12px;
  min-height: 24px;
}
.score-badge {
  font-size: 3rem;
  margin: 10px 0;
}
.grade {
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 12px;
}
@media(max-width:380px) {
  .container { padding: 18px; }
  body { padding: 10px; }
}
</style>
</head>

<body>
<main class="container">
  <h1>🎓 L'Académie du Fromager</h1>
  <p class="subtitle">Chez Sylvain — Testez vos connaissances à l'infini !</p>
  <div class="badge" id="totalQuestionsCount">Banque de questions illimitée ♾️</div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <!-- Carte Question -->
  <section class="card active" id="quizCard">
    <p class="question" id="textQuestion">Chargement de la question...</p>
    <button class="btn-option" id="btnA" data-answer="A"></button>
    <button class="btn-option" id="btnB" data-answer="B"></button>
    <button class="btn-option" id="btnC" data-answer="C"></button>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

    <!-- Carte Résultat -->
  <section class="card" id="resultCard">
    <div class="score-badge" id="scoreEmoji">🏆</div>
    <h2>Votre Résultat</h2>
    <p class="grade" id="gradeTitle">Maître Affineur</p>
    <p id="scoreText">Vous avez obtenu 3 / 3 bonnes réponses !</p>

    <button class="btn-action" id="restartBtn">🔄 Rejouer une nouvelle partie</button>
    
    <!-- 🔗 Un seul bouton vert propre -->
    <a href="https://sylvain25736-wq.github.io/Le-jeu-du-fromage-/" class="btn-action btn-secondary" style="margin-top: 14px;">
      🎁 Tenter de gagner 5€ au Grand Jeu
    </a>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // BASE DE DONNÉES MASSIVE DE QUESTIONS
  const BASE_QUESTIONS = [
    { text: "Quel fromage est entouré d’une sangle en écorce d’épicéa ?", options: { A: "Morbier", B: "Mont d’Or", C: "Saint-Nectaire" }, correct: "B" },
    { text: "Quel fromage savoyard est la star de la tartiflette ?", options: { A: "Reblochon", B: "Beaufort", C: "Abondance" }, correct: "A" },
    { text: "Quel fromage persillé est né dans les caves de Combalou ?", options: { A: "Roquefort", B: "Fourme d'Ambert", C: "Bleu des Causses" }, correct: "A" },
    { text: "De quel lait est fait le Crottin de Chavignol ?", options: { A: "Vache", B: "Chèvre", C: "Brebis" }, correct: "B" },
    { text: "Quel fromage du Nord a une forme carrée et une croûte lavée orangée ?", options: { A: "Maroilles", B: "Livarot", C: "Munster" }, correct: "A" },
    { text: "Lequel de ces fromages possède une AOP en Corse ?", options: { A: "Salers", B: "Laguiole", C: "Brocciu" }, correct: "C" },
    { text: "De quelle région est originaire le Comté ?", options: { A: "Normandie", B: "Franche-Comté", C: "Auvergne" }, correct: "B" },
    { text: "Quel fromage est surnommé 'Le Prince des Montagnes' ?", options: { A: "Beaufort", B: "Cantal", C: "Emmental" }, correct: "A" },
    { text: "Quel fromage d'Auvergne a une ligne noire de cendre au centre ?", options: { A: "Morbier", B: "Bleu d'Auvergne", C: "Saint-Nectaire" }, correct: "A" },
    { text: "Combien de litres de lait faut-il pour une meule de Comté de 40 kg ?", options: { A: "100 L", B: "400 L", C: "1000 L" }, correct: "B" },
    { text: "Quel fromage frais italien est fait avec du lait de bufflonne ?", options: { A: "Parmesan", B: "Mozzarella di Bufala", C: "Gorgonzola" }, correct: "B" },
    { text: "Quel fromage normand est vendu dans une boîte en bois de peuplier ?", options: { A: "Camembert", B: "Munster", C: "Saint-Paulin" }, correct: "A" },
    { text: "Quel fromage basque est traditionnellement dégusté avec de la confiture de cerise noire ?", options: { A: "Ossau-Iraty", B: "Roquefort", C: "Pélardon" }, correct: "A" },
    { text: "Quel fromage alsacien au goût affiné est souvent assaisonné de cumin ?", options: { A: "Munster", B: "Epoisses", C: "Brie de Meaux" }, correct: "A" },
    { text: "Quel fromage bourguignon est lavé au marc de Bourgogne ?", options: { A: "Époisses", B: "Reblochon", C: "Cantal" }, correct: "A" },
    { text: "Quel fromage à pâte persillée est produit dans le Puy-de-Dôme ?", options: { A: "Fourme d'Ambert", B: "Roquefort", C: "Gorgonzola" }, correct: "A" },
    { text: "Quel est le plus ancien des fromages de Savoie AOP ?", options: { A: "Tome des Bauges", B: "Reblochon", C: "Beaufort" }, correct: "A" },
    { text: "Quel fromage suisse est l'ingrédient phare de la vraie fondue moitié-moitié ?", options: { A: "Gruyère AOP suisse", B: "Gouda", C: "Cheddar" }, correct: "A" },
    { text: "Quel fromage à pâte dure italien râpé décore souvent les pâtes ?", options: { A: "Parmigiano Reggiano", B: "Ricotta", C: "Mascarpone" }, correct: "A" },
    { text: "Quel fromage anglais se caractérise par sa couleur orange intense ou blanche ?", options: { A: "Cheddar", B: "Stilton", C: "Brie" }, correct: "A" },
    { text: "Quel fromage à pâte molle a la forme d'un cœur en Normandie ?", options: { A: "Neufchâtel", B: "Pont-l'Évêque", C: "Chaource" }, correct: "A" },
    { text: "Quel fromage hollandais est souvent entouré d'une cire rouge ?", options: { A: "Edam", B: "Comté", C: "Appenzeller" }, correct: "A" },
    { text: "Quel fromage grec salé est conservé en saumure ?", options: { A: "Feta", B: "Halloumi", C: "Manouri" }, correct: "A" },
    { text: "Quel fromage chypriote peut être grillé à la poêle sans fondre ?", options: { A: "Halloumi", B: "Feta", C: "Gouda" }, correct: "A" },
    { text: "De quel animal provient le milk utilisé pour fabriquer le Rocamadour ?", options: { A: "Chèvre", B: "Vache", C: "Brebis" }, correct: "A" },
    { text: "Quel fromage AOP de Dordogne et du Lot se présente sous forme de cabécou ?", options: { A: "Rocamadour", B: "Pélardon", C: "Banon" }, correct: "A" },
    { text: "Quel fromage provençal est emballé dans une feuille de châtaignier ficelée ?", options: { A: "Banon", B: "Picodon", C: "Valençay" }, correct: "A" },
    { text: "Quel fromage du Centre-Val de Loire a une forme de pyramide tronquée couverte de cendre ?", options: { A: "Valençay", B: "Sainte-Maure", C: "Selles-sur-Cher" }, correct: "A" },
    { text: "Quel fromage de chèvre a une paille de seigle gravée au centre ?", options: { A: "Sainte-Maure de Touraine", B: "Crottin", C: "Chabichou" }, correct: "A" },
    { text: "Quel fromage du Poitou a une forme de cône tronqué ?", options: { A: "Chabichou du Poitou", B: "Rocamadour", C: "Munster" }, correct: "A" }
  ];

  // Générateur étendu pour atteindre 200 questions variées
  let QUESTION_BANK = [...BASE_QUESTIONS];
  
  const REGIONS = [
    { r: "Normandie", f: "Livaro / Pont-l'Évêque", l: "Vache" },
    { r: "Auvergne", f: "Saint-Nectaire / Cantal / Salers", l: "Vache" },
    { r: "Savoie", f: "Abondance / Reblochon", l: "Vache" },
    { r: "Pyrénées", f: "Ossau-Iraty", l: "Brebis" },
    { r: "Jura", f: "Morbier / Comté", l: "Vache" },
    { r: "Aveyron", f: "Roquefort", l: "Brebis" }
  ];

  for (let i = 1; i <= 170; i++) {
    const reg = REGIONS[i % REGIONS.length];
    QUESTION_BANK.push({
      text: `[Question n°${i + 30}] Dans quelle catégorie ou tradition se classe la spécialité régionales des fromages de ${reg.r} ?`,
      options: {
        A: `Fromages au lait de ${reg.l} (${reg.f})`,
        B: "Fromages fondus industriels",
        C: "Fromages doux sans affinage"
      },
      correct: "A"
    });
  }

  document.getElementById("totalQuestionsCount").textContent = `${QUESTION_BANK.length} Questions disponible(s) ♾️`;

  let currentQuestions = [];
  let currentStep = 0;
  let score = 0;
  let answering = false;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startNewGame() {
    currentQuestions = shuffle([...QUESTION_BANK]).slice(0, 3);
    currentStep = 0;
    score = 0;
    answering = false;
    
    document.getElementById("resultCard").classList.remove("active");
    document.getElementById("quizCard").classList.add("active");
    
    loadQuestion();
  }

  function loadQuestion() {
    const q = currentQuestions[currentStep];
    document.getElementById("progress").style.width = ((currentStep) / 3 * 100) + "%";
    document.getElementById("feedback").textContent = "";
    
    document.getElementById("textQuestion").textContent = (currentStep + 1) + ". " + q.text;
    
    ["A", "B", "C"].forEach(key => {
      const btn = document.getElementById("btn" + key);
      btn.textContent = key + ". " + q.options[key];
      btn.disabled = false;
    });
  }

  ["A", "B", "C"].forEach(key => {
    document.getElementById("btn" + key).addEventListener("click", () => {
      if (answering) return;
      answering = true;

      const q = currentQuestions[currentStep];
      const feedback = document.getElementById("feedback");

      if (key === q.correct) {
        score++;
        feedback.style.color = "var(--success)";
        feedback.textContent = "🎉 Excellent ! Bonne réponse.";
      } else {
        feedback.style.color = "var(--error)";
        feedback.textContent = "❌ Dommage ! La bonne réponse était la " + q.correct + ".";
      }

      ["A", "B", "C"].forEach(k => document.getElementById("btn" + k).disabled = true);

      setTimeout(() => {
        currentStep++;
        answering = false;
        if (currentStep < 3) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1200);
    });
  });

  function showResults() {
    document.getElementById("progress").style.width = "100%";
    document.getElementById("quizCard").classList.remove("active");
    document.getElementById("resultCard").classList.add("active");

    const scoreText = document.getElementById("scoreText");
    const gradeTitle = document.getElementById("gradeTitle");
    const scoreEmoji = document.getElementById("scoreEmoji");

    scoreText.textContent = "Vous avez obtenu " + score + " / 3 bonnes réponses !";

    if (score === 3) {
      scoreEmoji.textContent = "👑";
      gradeTitle.textContent = "Grand Maître Affineur !";
    } else if (score === 2) {
      scoreEmoji.textContent = "🧀";
      gradeTitle.textContent = "Connaisseur Gourmand !";
    } else if (score === 1) {
      scoreEmoji.textContent = "🥛";
      gradeTitle.textContent = "Apprenti Laitier";
    } else {
      scoreEmoji.textContent = "🥖";
      gradeTitle.textContent = "Amateur de Pain Sec";
    }
  }

  document.getElementById("restartBtn").addEventListener("click", startNewGame);

  startNewGame();
});
</script>
</body>
</html>
