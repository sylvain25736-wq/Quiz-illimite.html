<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Académie du Fromager — Quiz Illimité | Chez Sylvain</title>
<meta name="theme-color" content="#d97706">

<style>
:root {
  --primary: #d97706;
  --bg: #fef3c7;
  --dark: #2d2013;
  --white: #fff;
  --error: #dc2626;
  --success: #059669;
  --card-border: #fcd34d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--dark);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 500px;
  background: var(--white);
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 10px 25px #2d20131a;
  border: 3px solid var(--primary);
  text-align: center;
  margin-bottom: 18px;
}
h1 {
  font-size: clamp(1.8rem, 7vw, 2.3rem);
  color: var(--primary);
  margin: 0 0 8px;
}
.subtitle {
  font-size: .95rem;
  margin: 0 0 16px;
  font-style: italic;
  color: #6b523b;
}
.badge {
  display: inline-block;
  background: var(--bg);
  color: var(--primary);
  border: 1.5px solid var(--primary);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: bold;
  margin-bottom: 18px;
}
.progress-bar {
  height: 8px;
  background: #fee2e2;
  border-radius: 5px;
  margin-bottom: 22px;
  overflow: hidden;
}
.progress {
  height: 100%;
  background: var(--primary);
  width: 0;
  transition: width .3s;
}
.card { display: none; }
.card.active { display: block; }
.question {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.45;
  margin: 0 0 18px;
}
.btn-option {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #fffbeb;
  border: 2px solid var(--card-border);
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--dark);
  cursor: pointer;
  text-align: left;
}
.btn-option:hover,
.btn-option:focus {
  background: var(--primary);
  color: #fff;
}
.btn-option:disabled { opacity: .65; }
.btn-action {
  background: var(--primary);
  color: #fff;
  border: 0;
  padding: 14px 20px;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  text-decoration: none;
  display: inline-block;
}
.btn-secondary {
  background: #059669;
}
.feedback {
  font-weight: 700;
  margin-top: 12px;
  min-height: 24px;
}
.score-badge {
  font-size: 3rem;
  margin: 10px 0;
}
.grade {
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 12px;
}
@media(max-width:380px) {
  .container { padding: 18px; }
  body { padding: 10px; }
}
</style>
</head>

<body>
<main class="container">
  <h1>🎓 L'Académie du Fromager</h1>
  <p class="subtitle">Chez Sylvain — Testez vos connaissances à l'infini !</p>
  <div class="badge" id="totalQuestionsCount">Grande banque d'experts ♾️</div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <!-- Carte Question -->
  <section class="card active" id="quizCard">
    <p class="question" id="textQuestion">Chargement de la question...</p>
    <button class="btn-option" id="btnA" data-answer="A"></button>
    <button class="btn-option" id="btnB" data-answer="B"></button>
    <button class="btn-option" id="btnC" data-answer="C"></button>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <!-- Carte Résultat -->
  <section class="card" id="resultCard">
    <div class="score-badge" id="scoreEmoji">🏆</div>
    <h2>Votre Résultat</h2>
    <p class="grade" id="gradeTitle">Maître Affineur</p>
    <p id="scoreText">Vous avez obtenu 3 / 3 bonnes réponses !</p>

    <button class="btn-action" id="restartBtn">🔄 Rejouer une nouvelle partie</button>
    
    <a href="https://sylvain25736-wq.github.io/Le-jeu-du-fromage-/" class="btn-action btn-secondary" style="margin-top: 14px;">
      🎁 Tenter de gagner 5€ au Grand Jeu
    </a>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // GRANDE BASE DE 60 QUESTIONS D'EXPERTS SANS AUCUNE MAUVAISE RÉPONSE ABURDE
  const QUESTION_BANK = [
    { text: "Quel fromage est traditionnellement entouré d’une sangle en écorce d’épicéa ?", options: { A: "Le Morbier", B: "Le Mont d’Or", C: "Le Saint-Nectaire" }, correct: "B" },
    { text: "Quel fromage savoyard, né dans la vallée de Thônes, est la star de la tartiflette ?", options: { A: "Le Reblochon", B: "Le Beaufort", C: "L’Abondance" }, correct: "A" },
    { text: "Quel célèbre fromage persillé français est né dans les caves de Combalou ?", options: { A: "Le Roquefort", B: "La Fourme d'Ambert", C: "Le Bleu des Causses" }, correct: "A" },
    { text: "De quel lait est traditionnellement fabriqué le véritable Crottin de Chavignol ?", options: { A: "De vache", B: "De chèvre", C: "De brebis" }, correct: "B" },
    { text: "Quel fromage à pâte pressée non cuite, reconnaissable à sa bande de lin rouge, vient du Nord ?", options: { A: "Le Maroilles", B: "Le Livarot", C: "Le Munster" }, correct: "B" },
    { text: "Lequel de ces fromages possède une appellation d'origine protégée (AOP) en Corse ?", options: { A: "Le Salers", B: "Le Laguiole", C: "Le Brocciu" }, correct: "C" },
    { text: "De quelle région française est originaire le fameux Comté ?", options: { A: "La Normandie", B: "La Franche-Comté", C: "L'Auvergne" }, correct: "B" },
    { text: "Quel fromage jurassien se caractérise par sa ligne caractéristique de cendre végétale en son milieu ?", options: { A: "Le Morbier", B: "Le Saint-Nectaire", C: "Le Bleu de Gex" }, correct: "A" },
    { text: "Quel fromage pyrénéen au lait de brebis se déuste traditionnellement avec de la confiture de cerise noire ?", options: { A: "L'Ossau-Iraty", B: "Le Roquefort", C: "Le Pélardon" }, correct: "A" },
    { text: "Quel fromage normand à pâte molle et croûte fleurie a la forme d'un cœur ?", options: { A: "Le Neufchâtel", B: "Le Camembert", C: "Le Livarot" }, correct: "A" },
    { text: "Quel fromage auvergnat bénéficie d'une AOP et se distingue par son onctuosité et son goût de noisette ?", options: { A: "Le Saint-Nectaire", B: "Le Salers", C: "Le Cantal" }, correct: "A" },
    { text: "Quel fromage de chèvre du Centre-Val de Loire est façonné en forme de pyramide tronquée et cendré ?", options: { A: "Le Valençay", B: "Le Selles-sur-Cher", C: "Le Pouligny-Saint-Pierre" }, correct: "A" },
    { text: "Quel fromage à pâte pressée cuite est surnommé 'Le Prince des Alpages' ?", options: { A: "Le Beaufort", B: "L'Emmental de Savoie", C: "Le Gruyère" }, correct: "A" },
    { text: "Quel fromage alsacien à croûte lavée est réputé pour son parfum corsé et sa couleur orangée ?", options: { A: "Le Munster", B: "L'Époisses", C: "Le Maroilles" }, correct: "A" },
    { text: "Quel fromage bourguignon est frotté au marc de Bourgogne pendant son affinage ?", options: { A: "L'Époisses", B: "Le Langres", C: "Le Soumaintrain" }, correct: "A" },
    { text: "Quel est le principal ingrédient utilisé pour le caillage du lait en fromagerie traditionnelle ?", options: { A: "La présure", B: "Le vinaigre blanc", C: "Le bicarbonate" }, correct: "A" },
    { text: "Comment appelle-t-on la croûte naturelle obtenue sur certains fromages de chèvre grâce à un saupoudrage de charbon de bois ?", options: { A: "Une croûte cendrée", B: "Une croûte lavée", C: "Une croûte persillée" }, correct: "A" },
    { text: "Quel fromage suisse entre traditionnellement dans la composition de la fondue moitié-moitié aux côtés du Gruyère AOP ?", options: { A: "Le Vacherin Fribourgeois", B: "L'Appenzeller", C: "L'Emmental suisse" }, correct: "A" },
    { text: "Quel fromage de chèvre du Poitou est traditionnellement traversé par une paille de seigle gravée ?", options: { A: "Le Sainte-Maure de Touraine", B: "Le Chabichou du Poitou", C: "Le Valençay" }, correct: "A" },
    { text: "Quel fromage provençal au lait de chèvre est enveloppé et ficelé dans une feuille de châtaignier ?", options: { A: "Le Banon", B: "Le Pélardon", C: "Le Picodon" }, correct: "A" },
    { text: "Quel fromage à pâte persillée est produit traditionnellement dans le massif de la Chartreuse ?", options: { A: "Le Bleu de Vercors-Sassenage", B: "La Fourme de Montbrison", C: "Le Bleu des Causses" }, correct: "A" },
    { text: "De quel animal tire-t-on le lait pour fabriquer le Roquefort AOP ?", options: { A: "La brebis (race Lacaune)", B: "La vache de pâturage", C: "La chèvre alpine" }, correct: "A" },
    { text: "Quel fromage de type pâte pressée non cuite est originaire du Cantal et fabriqué en Auvergne ?", options: { A: "Le Cantal", B: "Le Saint-Nectaire", C: "Le Salers" }, correct: "A" },
    { text: "Quel fromage italien à base de lait de bufflonne est mondialement célèbre pour sa fraicheur ?", options: { A: "La Mozzarella di Bufala", B: "Le Parmesan", C: "La Burrata" }, correct: "A" },
    { text: "Quel fromage à pâte dure originaire d'Émilie-Romagne est râpé traditionnellement sur les pâtes ?", options: { A: "Le Parmigiano Reggiano", B: "Le Pecorino Romano", C: "Le Grana Padano" }, correct: "A" },
    { text: "Quel fromage anglais se distingue par sa pâte persillée bleue veinée et son goût puissant ?", options: { A: "Le Stilton", B: "Le Cheddar", C: "Le Red Leicester" }, correct: "A" },
    { text: "Quel fromage hollandais à pâte pressée non cuite est souvent reconnaissable à sa croûte paraffinée de couleur rouge ?", options: { A: "L'Edam", B: "Le Gouda", C: "Le Maasdam" }, correct: "A" },
    { text: "Quel fromage grec à base de lait de brebis et de chèvre est affiné et conservé en saumure ?", options: { A: "La Feta", B: "Le Halloumi", C: "Le Manouri" }, correct: "A" },
    { text: "Quel fromage chypriote a la particularité de ne pas fondre lorsqu'on le grille ou le poêle ?", options: { A: "Le Halloumi", B: "La Feta", C: "Le Kasseri" }, correct: "A" },
    { text: "Quel fromage fermier d'Aquitaine, au lait de chèvre, a la forme d'un petit palet plat ?", options: { A: "Le Rocamadour", B: "Le Pélardon", C: "Le Chabichou" }, correct: "A" },
    { text: "Quel fromage normand tire son nom d'un petit bourg du Pays d'Auge et possède une boîte en peuplier ?", options: { A: "Le Camembert de Normandie", B: "Le Livarot", C: "Le Pont-l'Évêque" }, correct: "A" },
    { text: "Quel fromage auvergnat persillé est produit exclusivement dans la zone des monts du Forez ?", options: { A: "La Fourme de Montbrison", B: "La Fourme d'Ambert", C: "Le Bleu d'Auvergne" }, correct: "A" },
    { text: "Quel fromage à croûte lavée champenois est présenté dans une boîte ronde en bois et se déguste souvent chaud à la cuillère ?", options: { A: "Le Langres", B: "Le Chaource", C: "L'Époisses" }, correct: "A" },
    { text: "Quel fromage champenois à croûte fleurie a une forme cylindrique avec une petite cuvette sur le dessus ?", options: { A: "Le Langres", B: "Le Chaource", C: "Le Soumaintrain" }, correct: "A" },
    { text: "Quel fromage de l'Yonne à pâte molle et croûte fleurie a un goût délicat de noisette et une texture fondante ?", options: { A: "Le Chaource", B: "Le Coulommiers", C: "Le Brie de Meaux" }, correct: "A" },
    { text: "Quel grand brie fermier est considéré comme le 'roi des fromages' lors du congrès de Vienne en 1815 ?", options: { A: "Le Brie de Meaux", B: "Le Brie de Melun", C: "Le Coulommiers" }, correct: "A" },
    { text: "Quel fromage savoyard à pâte pressée non cuite possède une croûte brossée et des petits trous épars ?", options: { A: "La Tomme de Savoie", B: "L'Abondance", C: "Le Beaufort" }, correct: "A" },
    { text: "Quel fromage suisse à pâte dure présente de grandes ouvertures (les 'trous') dues à la fermentation ?", options: { A: "L'Emmental", B: "Le Gruyère", C: "L'Appenzeller" }, correct: "A" },
    { text: "Quel fromage à pâte pressée cuite suisse ne comporte pratiquement pas de trous ?", options: { A: "Le Gruyère AOP suisse", B: "L'Emmental", C: "Le Sbrinz" }, correct: "A" },
    { text: "Quel fromage basque auvergnat ou pyrénéen utilise le lait cru entier de brebis des races Manech ?", options: { A: "L'Ossau-Iraty", B: "Le Roquefort", C: "Le Brocciu" }, correct: "A" },
    { text: "Quel fromage est obtenu par l'égouttage du petit-lait (lactosérum) en Corse ?", options: { A: "Le Brocciu", B: "La brousse", C: "La ricotta" }, correct: "A" },
    { text: "Comment appelle-t-on le stade de maturation d'un fromage en cave sous la surveillance du fromager ?", options: { A: "L'affinage", B: "Le caillage", C: "Le moulage" }, correct: "A" },
    { text: "Quel équipement en bois ou en plastique sert à soutenir les fromages pendant leur affinage en cave ?", options: { A: "Une planche d'affinage", B: "Un hie", C: "Une faisselle" }, correct: "A" },
    { text: "Quel ustensile perforé permet d'égoutter le caillé lors de la fabrication des faisselles et des fromages frais ?", options: { A: "La faisselle", B: "Le moule à brie", C: "La skirlette" }, correct: "A" },
    { text: "Quel terme désigne le liquide jaune verdâtre qui se sépare du caillé lors de la coagulation ?", options: { A: "Le petit-lait (ou lactosérum)", B: "La caillebotte", C: "Le sérum de presure" }, correct: "A" },
    { text: "Quel fromage auvergnat au lait cru de vache est fabriqué exclusivement avec le lait de vaches de race Salers ?", options: { A: "Le Salers AOP", B: "Le Cantal", C: "Le Saint-Nectaire" }, correct: "A" },
    { text: "Quel fromage de chèvre du Languedoc a la forme d'un petit cône tronqué très sec ?", options: { A: "Le Pélardon", B: "Le Rocamadour", C: "Le Picodon" }, correct: "A" },
    { text: "Quel fromage de chèvre de la Drôme et de l'Ardèche a un goût noisetté prononcé et se nomme souvent d'après sa région ?", options: { A: "Le Picodon", B: "Le Banon", C: "Le Pélardon" }, correct: "A" },
    { text: "Quel fromage à pâte pressée cuite du Jura est affiné au minimum pendant 120 jours (et souvent bien plus) ?", options: { A: "Le Comté", B: "Le Beaufort", C: "L'Abondance" }, correct: "A" },
    { text: "Quel fromage à pâte pressée cuite savoyard possède un talon concave caractéristique ?", options: { A: "Le Beaufort", B: "Le Comté", C: "L'Emmental" }, correct: "A" },
    { text: "Quel fromage d'appellation d'origine du massif du Jura est élaboré exclusivement dans des cuves en cuivre ?", options: { A: "Le Comté", B: "Le Morbier", C: "Le Mont d'Or" }, correct: "A" },
    { text: "Quel fromage persillé du Haut-Jura est percé de grands trous lors de son affinage ?", options: { A: "Le Bleu de Gex Haut-Jura", B: "Le Roquefort", C: "Le Bleu d'Auvergne" }, correct: "A" },
    { text: "Quel fromage à croûte lavée originaire de la région de Langres se mange parfois 'arrosé' de champagne ou de marc ?", options: { A: "Le Langres", B: "L'Époisses", C: "Le Munster" }, correct: "A" },
    { text: "Quel fromage normand, cousin du camembert, est un peu plus grand et plus épais ?", options: { A: "Le Coulommiers", B: "Le Neufchâtel", C: "Le Livarot" }, correct: "A" },
    { text: "Quel fromage à pâte persillée d'Auvergne tire sa force de l'alliance du penicillium roqueforti et du lait de vache ?", options: { A: "Le Bleu d'Auvergne", B: "La Fourme d'Ambert", C: "Le Bleu des Causses" }, correct: "A" },
    { text: "Quel fromage doux et crémeux au lait de vache est la base de nombreuses recettes de cuisine familiale en Bresse ?", options: { A: "La Crème de Bresse", B: "Le Brillat-Savarin", C: "Le Chaource" }, correct: "A" },
    { text: "Quel fromage triple-crème français doit son nom à un célèbre magistrat et gastronome du XVIIIe siècle ?", options: { A: "Le Brillat-Savarin", B: "Le Saint-André", C: "L'Excelsior" }, correct: "A" },
    { text: "Quel fromage à pâte molle et croûte fleurie est enrichi en crème fraîche pour devenir un irrésistible triple-crème ?", options: { A: "Le Brillat-Savarin", B: "Le Camembert", C: "Le Coulommiers" }, correct: "A" },
    { text: "Quel fromage des Pyrénées au lait de vache se reconnait à sa belle croûte noire ou grise et sa pâte fondante ?", options: { A: "La Tomme des Pyrénées", B: "L'Ossau-Iraty", C: "Le Barousse" }, correct: "A" },
    { text: "Quel fromage fermier des montagnes basques est fabriqué à partir de lait de brebis non pasteurisé ?", options: { A: "L'Ossau-Iraty fermier", B: "Le Roquefort", C: "Le Pélardon" }, correct: "A" }
  ];

  document.getElementById("totalQuestionsCount").textContent = `${QUESTION_BANK.length} Questions d'experts ♾️`;

  let currentQuestions = [];
  let currentStep = 0;
  let score = 0;
  let answering = false;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startNewGame() {
    currentQuestions = shuffle([...QUESTION_BANK]).slice(0, 3);
    currentStep = 0;
    score = 0;
    answering = false;
    
    document.getElementById("resultCard").classList.remove("active");
    document.getElementById("quizCard").classList.add("active");
    
    loadQuestion();
  }

  function loadQuestion() {
    const q = currentQuestions[currentStep];
    document.getElementById("progress").style.width = ((currentStep) / 3 * 100) + "%";
    document.getElementById("feedback").textContent = "";
    
    document.getElementById("textQuestion").textContent = (currentStep + 1) + ". " + q.text;
    
    ["A", "B", "C"].forEach(key => {
      const btn = document.getElementById("btn" + key);
      btn.textContent = key + ". " + q.options[key];
      btn.disabled = false;
    });
  }

  ["A", "B", "C"].forEach(key => {
    document.getElementById("btn" + key).addEventListener("click", () => {
      if (answering) return;
      answering = true;

      const q = currentQuestions[currentStep];
      const feedback = document.getElementById("feedback");

      if (key === q.correct) {
        score++;
        feedback.style.color = "var(--success)";
        feedback.textContent = "🎉 Excellent ! Bonne réponse.";
      } else {
        feedback.style.color = "var(--error)";
        feedback.textContent = "❌ Dommage ! La bonne réponse était la " + q.correct + ".";
      }

      ["A", "B", "C"].forEach(k => document.getElementById("btn" + k).disabled = true);

      setTimeout(() => {
        currentStep++;
        answering = false;
        if (currentStep < 3) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1200);
    });
  });

  function showResults() {
    document.getElementById("progress").style.width = "100%";
    document.getElementById("quizCard").classList.remove("active");
    document.getElementById("resultCard").classList.add("active");

    const scoreText = document.getElementById("scoreText");
    const gradeTitle = document.getElementById("gradeTitle");
    const scoreEmoji = document.getElementById("scoreEmoji");

    scoreText.textContent = "Vous avez obtenu " + score + " / 3 bonnes réponses !";

    if (score === 3) {
      scoreEmoji.textContent = "👑";
      gradeTitle.textContent = "Grand Maître Affineur !";
    } else if (score === 2) {
      scoreEmoji.textContent = "🧀";
      gradeTitle.textContent = "Connaisseur Gourmand !";
    } else if (score === 1) {
      scoreEmoji.textContent = "🥛";
      gradeTitle.textContent = "Apprenti Laitier";
    } else {
      scoreEmoji.textContent = "🥖";
      gradeTitle.textContent = "Amateur de Pain Sec";
    }
  }

  document.getElementById("restartBtn").addEventListener("click", startNewGame);

  startNewGame();
});
</script>
</body>
</html>
